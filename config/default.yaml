# agentic-configuration-search reference config — every key with its default (README.md is normative)
#
# Every value here equals the code default (test_default_yaml_matches_dataclass_defaults
# in tests/test_config.py guards against drift).
# A real run config only lists the keys it changes — the rest are filled from defaults,
# and undeclared keys fail immediately with ConfigError (so typos aren't silently absorbed).

dataset: demo_data/soccer-players-5fuqs   # (required) Roboflow root — needs train/ plus valid/ (holdout; falls back to test/ if valid/ is absent)
out_dir: runs                             # root for run artifacts (--out takes precedence)
rounds: 10                                # planner round cap — saturation wins if it stops first
# β of the decision metric F-beta — 1.0=F1, >1 weights recall, <1 weights precision.
# Runs through threshold estimation, screen scoring, the adoption gate and the rescorer α curve.
beta: 1.0
# Operator-supplied description of the dataset (optional) — inserted verbatim into the
# LLM planner prompt only (the deterministic planner ignores it). With "" the prompt has no such block.
dataset_notes: ""
# Execution randomness seed — material-mining sampling, lora, crop classifier training, gate bootstrap.
# Kept separate from split.seed (split boundaries), so search variance can be measured
# by varying only this value with fit_train/fit_dev fixed.
run_seed: 0

planner:
  kind: llm                               # llm | deterministic (deterministic is the A/B control and for environments without an LLM)
  model: Qwen/Qwen3.8-27B-FP8             # vLLM model for kind=llm
  base_url: null                          # running vLLM endpoint. null = start via launch (attach if persist)
  crop_notes: true                        # show the VLM crops of every prompt sample and merge its descriptions into the diagnosis
                                          # (kind=llm only, diagnostic signal only — never on the decision path)
  max_reasks: 1                           # re-asks within the round when every candidate is rejected before holdout (0=off, kind=llm only)
  max_candidates: 3                       # planner candidates per round 1..3 (prompt, schema and re-ask cap; deterministic follows too; larger responses exceed the output cap)
  launch:                                 # vLLM launch parameters when kind=llm and base_url is null
    gpu: 3
    port: 8104
    host: 127.0.0.1
    gpu_memory_utilization: 0.9           # vLLM memory share — preallocates weights + KV cache pool
    max_model_len: 16384                  # headroom for late rounds with long history (the budget guard prevents overflow)
    startup_timeout: 1800
    enforce_eager: false                  # true disables CUDA graphs (avoids OOM on shared GPUs)
    persist: true                         # resident: attach to a healthy port, not torn down at run end

gate:                                     # adoption gate
  margin: 0.0                             # adopt iff one-sided CI lower bound of holdout Δ micro F(β) ≥ margin **and** Δ > 0
  min_delta: 0.005                        # …and point estimate Δ ≥ min_delta — blocks noise-level adoptions (0=off)
  bootstrap: 2000                         # paired bootstrap resamples
  confidence: 0.95                        # CI confidence level (alpha = 1 - confidence)

saturation:                               # stopping rule
  rounds: 5                               # stop after this many consecutive stalled rounds
  epsilon: 0.0                            # a round is stalled if the Δ CI lower bound is ≤ this
  empty_rounds: 2                         # stop after this many consecutive rounds that measured nothing on holdout (0=off; rounds with candidates skipped by the fit_dev verdict are excluded)

screen:
  top_k: 2                                # candidates promoted to holdout after fit_dev scoring
  # tiling prescreen — a candidate turning on grid ≥ min_grid is first scored on a
  # deterministic fit_dev subset (max(min_images, ⌈fraction·N⌉) images by filename
  # hash). If no class uses a tile there, it is rejected as axis_unused without the
  # full screen; otherwise the full fit_dev is screened as before (numbers
  # unchanged). 0 turns it off.
  prescreen_fraction: 0.25
  prescreen_min_images: 20
  prescreen_min_grid: 3                   # from grid 3 (10 forwards) — grid 2 (5) is screened in full
  prescreen_max_share: 0.5                # skip the prescreen when the subset is this share of fit_dev or more (full screen directly)
  # lost-value prescreen — a planner candidate containing a value that clearly
  # lost on fit_dev under the current champion (a single increment's
  # (candidate − champion) bootstrap upper bound < 0) is measured on the same
  # subset first (the full fit_dev without one). Upper bound < 0 rejects it as
  # lost_value_prescreen without the rescorer refit, full screen or holdout;
  # otherwise it proceeds
  lost_value_prescreen: true
  # pre-holdout fit_dev verdict — a screened candidate whose (candidate − champion)
  # bootstrap upper bound < 0 (fit_dev_lost) or whose per-image fit_dev
  # (tp, fp, fn) all equal the champion's (fit_dev_identical) is not sent to
  # holdout. top_k counts only sendable candidates (the next fills a freed slot).
  # Plain, carried and lora/classifier arm candidates alike
  skip_fit_dev_losers: true

split:                                    # boundaries stay fixed across rounds
  fit_train_ratio: 0.8                    # fit_train share within train (image-level stratified)
  seed: 0

subsample:                                # fit_train subset — thins only the lora, rescorer and crop classifier training material
  max_images: 400                         # if fit_train is larger, pick images in the order that covers the GT embedding clusters. 0 = off
  center_ratio: 0.1                       # k-centers per class = GT objects × ratio (at least 1)

detector:                                 # detector — YOLOE (ultralytics), in-process, no server
  model: weights_yoloe/yoloe-26x-seg.pt   # checkpoint path (relative paths resolve against repo_root)
  device: "cuda:0"
  apply_topk: 300
  iou_threshold: 0.5                      # IoU criterion shared by matching, τ and diagnosis

query:                                    # detector-call contract, fixed regardless of setting
  box_threshold: 0.03
  threshold_floor: 0.03                   # multimodal_threshold — floor for τ_c

mine:                                     # mining quotas and hygiene rules (the adoption gate belongs to the loop)
  exemplars_per_class: 4                  # default quotas 4/2/1/1.
  fn_exemplars_per_class: 2               #   count axes (exemplar_k etc.) may override per candidate
  visual_negatives_per_class: 1
  text_negatives_max_per_class: 1
  exemplar_selection: kcenter             # kcenter | mean | random
  kcenter_outlier_mad: 3.0                # outlier trim before kcenter — only centroid distance > median + k·MAD (0=off)
  fn_kcenter_outlier_mad: 3.5             # lighter for the FN arm (larger multiple) — filter noise but keep diversity
  fn_min_candidates: 5                    # FN-mining headroom pre-filter (0=off)
  fn_min_miss_rate: 0.02                  # minimum miss-rate pre-filter
  fn_min_area_ratio: 0.3                  # cut tiny candidates relative to median GT area
  visual_negative_min_score: 0.05                # negative candidate score floor (FP branch only)
  visual_negative_exclude_gt_iom: 0.7            # exclusion threshold for overlap (IoM) with same-class GT
  embedder_model: facebook/dinov3-vitl16-pretrain-lvd1689m   # gated — HF_TOKEN, or cache + HF_HUB_OFFLINE=1
  device: "cuda:0"                        # device for the embedding and crop-classifier training workers
  text_aliases: {}                        # manual aliases — always override generated ones

search:                                   # value space of the screen (fit_dev) grid (candidate axes decide what is on)
  max_threshold_candidates: 50
  tau_tolerance: 0.005                    # τ_c tie tolerance — within it, pick the point with the most margin
  neg_eta_grid: [0.25, 0.35, 0.5, 0.65, 0.75]   # negative suppression IoU threshold sweep
  # Tile grids — grid g (image-relative g×g) is the value of the planner-chosen
  # tiling axis (2–6); only parameters shared by every grid live here.
  # Zoom (g-1)(1-overlap)+1, 1+g² passes per image — resolution-independent.
  tiling_overlap: 0.5                     # overlap 0.5: grid 2 → 1.5×, grid 3 → 2.0×
  tiling_merge: sahi                      # sahi (SAHI GreedyNMM, IOS 0.5 — default) | nmm (union seam fragments) | nms
  tiling_merge_min_score: 0.3             # score to take part in the merge — below it, kept minus those overlapping a merged result
  # near-miss exception of the fold gate — s* is a TP-size quantile of the class with the most missed_small
  tiling_tp_quantile: 0.1                 # s* = this quantile of that class's TP sizes (input px)
  tiling_tp_min: 20                       # with fewer TPs in that class, the exception is not judged
  modalities: [semantic, text]
  disabled_axes: []                       # axes the planner may not turn on in this run (e.g. [lora, tiling]) — a champion's own value is kept
  disabled_values: {}                     # forbid only specific values of an axis — {axis: [value, ...]}

rescorer:                                 # discriminator on fit_train + α grid on fit_dev
  min_samples: 64                         # discriminator fit tripwire — below this P̂ degenerates to a constant
  min_samples_per_class: 50               # adequate per-class sample count for the α decision (fit_dev rows)
  alphas: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 3.0, 4.0] # 0.0 required — not adopting means exactly the current setting
  margin: 0.005                           # adopt α>0 only if the fit_dev F(β) gain exceeds this
  ensemble_members: 5
  inner_folds: 5                          # for the oof_phat diagnostic
  max_train_rows: 100000                  # discriminator training row cap — TPs first, FPs in (class × score quartile) strata + inverse-probability weights. 0 = off

crop_classifier:                          # detection reclassification axis — corrects class_confusion, suppresses background FPs (off by default, the planner turns it on)
  min_samples: 32                         # total crop tripwire — skip training below this
  min_background: 4                       # minimum background crops — without them reclassification is meaningless
  lambdas: [0.0, 0.25, 0.5, 0.75, 1.0]    # blend λ grid — score = s^(1-λ)·p(c*)^λ; λ=0 is relabel-only (no classifier is the baseline, not a λ)
  margin: 0.01                            # adopt the arm only if fit_dev ΔF(β) exceeds this
  reuse: true                             # train once per run (<run>/classifier_cache/), later proposals re-score only the λ grid
  retune_lambda: true                     # while the champion has a classifier, ordinary candidates (own setting) and lora candidates (winning arm) re-choose λ

lora:                                     # tail fine-tune + λ-interpolation arms — off by default, the planner turns it on
  min_images: 20                          # block lora candidates if fit_train has fewer images
  lambdas: [0.0, 0.25, 0.5, 0.75, 1.0]    # 0.0 required — λ=0 is bit-exact base
  margin: 0.01                            # adopt the arm only if fit_dev ΔF(β) exceeds this
  epochs: 10
  batch_size: 8
  lr: 0.001                               # AdamW lr0 (the worker pins optimizer=AdamW)
  device: "cuda:0"                        # keep off the shared vLLM planner GPU (planner.launch.gpu)

diagnose:                                 # FP/FN diagnosis criteria
  small_object_ratio: 0.04                # missed_small cut — object size relative to the image, √(box area/image area).
                                          #   0.04 = 4% of a side, about 26px at YOLOE's 640px input
